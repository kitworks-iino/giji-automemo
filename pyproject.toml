[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giji-automemo"
version = "0.3.0"
description = "Private-first Teams meeting recorder and Japanese meeting minutes for Windows 11"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "msal>=1.31,<2",
  "keyring>=25,<26",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
windows = [
  "pywin32>=308; sys_platform == 'win32'",
  "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
  "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
  "psutil>=6,<8",
  "tzdata>=2025.1",
  "tzlocal>=5,<6",
]
local = [
  "faster-whisper>=1.1,<2",
  # PyAV 17+ removed an argument used by faster-whisper's audio decoder.
  "av>=14,<17",
  "sherpa-onnx>=1.12,<2",
  "scipy>=1.14,<2",
  "huggingface-hub>=0.28,<2",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
giji = "giji.__main__:main"

[tool.setuptools.packages.find]
include = ["giji*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
